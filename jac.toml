[project]
name = "por-jac-enforced"
version = "0.1.0"
description = "Proof of Reserve — Jac Enforced (PoRJE): PoR attestations on a graph, minted only when three adversarial walkers agree."
# 0.37 requires a dotted module name here — no ".jac" extension, no path separators.
# "main.jac" is rejected outright; the file main.jac is addressed as module "main".
entry-point = "main"
kind = "service"
jac-version = "==0.37.23"

[serve]
port = 8000

[dependencies]
web3 = ">=6.0.0"
eth-account = ">=0.10.0"
requests = ">=2.31.0"
python-dotenv = ">=1.0.0"

[dev-dependencies]
pytest = ">=7.0.0"

[plugins]

[test]
# Test files use the *_tests.jac suffix: the test_* prefix collides with Python's
# test-module import machinery, so discovery is pointed at the directory instead
# of relying on the default test_* filename filter.
directory = "jac/tests"
