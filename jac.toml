[project]
name = "por-jac-enforced"
version = "0.1.0"
description = "Proof of Reserve - Jac Enforced (PoRJE) for JacHacks 2026: PoR attestations on a graph, minted only when three adversarial walkers agree."
authors = ["Justin Gramke", "Felix Berinde"]
entry-point = "main"
kind = "service"
jac-version = "==0.37.23"

[server]
port = 8000

[dependencies]
web3 = ">=6.0.0"
eth-account = ">=0.10.0"
requests = ">=2.31.0"
python-dotenv = ">=1.0.0"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[plugins]

[plugins.client]
debug = false
